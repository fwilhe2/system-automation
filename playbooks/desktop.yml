---
- name: Desktop (GNOME) Playbook
  hosts: all

  roles:
    # Skipped where Microsoft's repo signing fails modern OpenPGP verifiers:
    # Tumbleweed's rpm rejects the key armor, and the stale arm64 'code'
    # package ships a SHA-1-signed keyring that Debian's sqv rejects
    - role: iesplin.vscode
      become: true
      tags: [vscode]
      when: >-
        ansible_facts['distribution'] != 'openSUSE Tumbleweed'
        and not (ansible_facts['distribution'] == 'Debian' and ansible_facts['architecture'] == 'aarch64')

    - role: greenleader.codium
      become: true
      tags: [codium]

    - role: firefox
      tags: [firefox]

    # Flatpak talks to a session bus, which the test containers do not have
    - role: flatpak
      tags: [flatpak, notest]
      when: ansible_facts['os_family'] == 'RedHat'

    # Before the desktop packages, because enabling RPM Fusion can replace
    # packages that the ones below pull in
    - role: rpm_fusion
      become: true
      tags: [rpm_fusion]
      when: ansible_facts['distribution'] == 'Fedora'

    - role: desktop
      become: true
      tags: [desktop]

    - role: vscodium
      tags: [codium]

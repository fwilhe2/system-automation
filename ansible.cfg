[defaults]
# Relative paths here are resolved against this file, so every command works
# from the repository root without --inventory or ANSIBLE_ROLES_PATH.
inventory = inventories/local/hosts.yml

# vendor/roles holds the third-party copies, kept apart from ours so the
# linters need a single exclusion rather than one per vendored role.
roles_path = roles:vendor/roles

# `ansible-galaxy install -r requirements.yml` installs into the first entry,
# which keeps the collections next to the checkout instead of in the home
# directory. The defaults stay on the path so a system-wide or user-wide
# install is still found.
collections_path = .ansible-deps:~/.ansible/collections:/usr/share/ansible/collections

gathering = smart
retry_files_enabled = False
callback_result_format = yaml

# Discovery picks the system python3 either way; this only drops the warning
# about a future interpreter install changing that choice. The local inventory
# pins the interpreter, but the lima and container inventories do not, so
# silencing it here covers all of them.
interpreter_python = auto_silent

[ssh_connection]
# Fewer ssh round trips per task, which speeds up the lima runs and does
# nothing to the local connection. Safe as long as no target sets requiretty
# in sudoers, which none of the five distros do.
pipelining = True

---
- name: Purge Snap
  hosts: all
  become: true

  tasks:
    - name: Purge Snap on Debian and derivatives
      when:
        - "ansible_facts['os_family'] | lower == 'debian'"
      block:
        - name: Purge Snap
          ansible.builtin.include_role:
            name: bodsch.ansible-snapd

---
# The tarball holds gh_<version>_linux_<arch>/bin/gh next to the man pages;
# only the binary is installed.
- name: Install gh
  ansible.builtin.import_role:
    name: github_release
  vars:
    github_release_repository: "{{ gh_repository }}"
    github_release_binary: gh
    github_release_install_dir: "{{ gh_install_dir }}"
    github_release_asset: "{{ gh_archive_dir }}.tar.gz"
    github_release_checksums: "gh_{{ github_release_number }}_checksums.txt"
    github_release_include: ["{{ gh_archive_dir }}/bin/gh"]
    github_release_strip_components: 2
    github_release_mode: "0755"

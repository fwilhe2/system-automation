---
- name: Ensure /opt/firefox directory exists
  become: true
  become_user: root
  ansible.builtin.file:
    path: "/opt/firefox"
    state: directory
    mode: "750"
    owner: "{{ username }}"
    group: "{{ username }}"

- name: Ensure Application Desktop files directory exists
  ansible.builtin.file:
    path: "~/.local/share/applications/"
    state: directory
    mode: "750"

- name: Download Firefox
  ansible.builtin.get_url:
    url: "https://download.mozilla.org/?product={{ item.product }}&os=linux64&lang=en-US"
    dest: "/tmp/firefox-{{ item.id }}-latest.tar.xz"
    mode: "0644"
  loop: "{{ firefox_channels }}"
  loop_control:
    label: "{{ item.display_name }}"
  changed_when: false

- name: Ensure Firefox directory exists
  become: true
  become_user: root
  ansible.builtin.file:
    path: "/opt/firefox/firefox-{{ item.id }}/"
    state: directory
    mode: "750"
    owner: "{{ username }}"
    group: "{{ username }}"
  loop: "{{ firefox_channels }}"
  loop_control:
    label: "{{ item.display_name }}"

- name: Extract Firefox
  become: true
  become_user: root
  ansible.builtin.unarchive:
    src: "/tmp/firefox-{{ item.id }}-latest.tar.xz"
    dest: "/opt/firefox/firefox-{{ item.id }}/"
    remote_src: true
  loop: "{{ firefox_channels }}"
  loop_control:
    label: "{{ item.display_name }}"
  changed_when: false

# Firefox refuses to start on a --profile path that does not exist yet (it opens
# the profile manager and waits), but it happily populates an existing empty
# directory. Creating the directory here is all the "profile creation" that is
# needed - no -CreateProfile, no profiles.ini entry, no manual step.
- name: Ensure Firefox profile directory exists
  ansible.builtin.file:
    path: "{{ firefox_profile_root }}/{{ item.id }}"
    state: directory
    mode: "0700"
  loop: "{{ firefox_channels }}"
  loop_control:
    label: "{{ item.display_name }}"

# Enterprise policies are read per install directory, and every install
# directory here is dedicated to one channel, so this configures exactly one
# profile. This is what installs add-ons and locks preferences.
- name: Configure Firefox enterprise policies
  become: true
  become_user: root
  ansible.builtin.template:
    src: templates/policies.json.j2
    dest: "/opt/firefox/firefox-{{ item.id }}/firefox/distribution/policies.json"
    mode: "0644"
    validate: "python3 -m json.tool %s"
  loop: "{{ firefox_channels }}"
  loop_control:
    label: "{{ item.display_name }}"

- name: Create Firefox Desktop Entry
  ansible.builtin.template:
    src: templates/firefox.desktop.j2
    dest: "~/.local/share/applications/firefox-{{ item.id }}.desktop"
    mode: "0644"
  loop: "{{ firefox_channels }}"
  loop_control:
    label: "{{ item.display_name }}"

# The Developer Edition entry used to be named after the channel's marketing
# name rather than its product id.
- name: Remove superseded Firefox Desktop Entry
  ansible.builtin.file:
    path: "~/.local/share/applications/firefox-developer.desktop"
    state: absent

---
# The distributions ship the JDK, Node.js and Go in whatever vintage their
# release froze, so these tools come from upstream as tarballs instead. Each one
# is extracted into its own directory below development_upstream_prefix and
# nothing is put on PATH, which is what keeps them from colliding with the
# distribution packages the rest of this role installs.
#
# Every tool follows the same shape: skip the whole block when the pinned
# version is already installed, otherwise download, extract, drop the tarball.
# That guard is what makes the role idempotent, and it is also what stops a
# second run from downloading a few hundred megabytes just to throw them away
# again.
#
# The exact version of every tool, and the checksum of its tarball for each
# architecture, comes from files/upstream-checksums.yml. Nothing here asks
# upstream what its latest release is, so a new upstream release changes
# nothing until scripts/update-upstream-checksums.sh pins it, and a pin that
# lags behind upstream installs an older release instead of failing.

# The only check that can fail here is local: a major version overridden in
# local.yml without the pins being regenerated for it.
- name: Check the pinned upstream versions against the configured ones
  ansible.builtin.assert:
    that:
      - development_temurin_release is match('jdk-' ~ development_temurin_major ~ '[.+]')
      - development_node_version is match(development_node_major ~ '\.')
      - development_go_release is match('go' ~ development_go_version | regex_escape ~ '(\.|$)')
    fail_msg: >-
      files/upstream-checksums.yml pins Temurin {{ development_temurin_release }},
      Node.js {{ development_node_version }} and Go {{ development_go_release }},
      which does not match the configured Temurin {{ development_temurin_major }},
      Node.js {{ development_node_major }} and Go {{ development_go_version }}.
      Run scripts/update-upstream-checksums.sh to pin them.

# --- Eclipse Temurin ---
# The install directory is named by the feature release alone, so the release
# file in it is what says which build is there.
- name: Check for the Temurin JDK
  ansible.builtin.stat:
    path: "{{ development_temurin_home }}/release"
  register: development_temurin_release_file

- name: Read the installed Temurin release
  ansible.builtin.slurp:
    src: "{{ development_temurin_home }}/release"
  register: development_temurin_installed_release
  when: development_temurin_release_file.stat.exists

- name: Install Temurin {{ development_temurin_release }}
  when: >-
    not development_temurin_release_file.stat.exists or
    ('IMPLEMENTOR_VERSION="Temurin-' ~ development_temurin_release | regex_replace('^jdk-', '') ~ '"')
    not in (development_temurin_installed_release.content | b64decode)
  block:
    - name: Download Temurin
      ansible.builtin.get_url:
        url: "{{ development_upstream_checksums.temurin.url[development_temurin_architecture] }}"
        dest: "{{ development_temurin_tarball }}"
        checksum: "sha256:{{ development_upstream_checksums.temurin[development_temurin_architecture] }}"
        mode: "0600"

    - name: Remove the previous Temurin installation
      ansible.builtin.file:
        path: "{{ development_temurin_home }}"
        state: absent

    - name: Create the Temurin directory
      ansible.builtin.file:
        path: "{{ development_temurin_home }}"
        state: directory
        mode: "0755"

    # The tarball unpacks into a jdk-<full version> directory, which is dropped
    # so that the install path stays the feature release alone.
    - name: Extract Temurin
      ansible.builtin.unarchive:
        src: "{{ development_temurin_tarball }}"
        dest: "{{ development_temurin_home }}"
        remote_src: true
        extra_opts: [--strip-components=1]

    - name: Remove the Temurin tarball
      ansible.builtin.file:
        path: "{{ development_temurin_tarball }}"
        state: absent

- name: Document the Temurin install
  ansible.builtin.copy:
    dest: "{{ development_temurin_home }}/README.upstream"
    mode: "0644"
    content: |
      Eclipse Temurin {{ development_temurin_major }}, installed from upstream.
      To use it, add to your shell profile:

        export JAVA_HOME={{ development_temurin_home }}
        export PATH="$JAVA_HOME/bin:$PATH"

# --- Node.js ---
- name: Check for Node.js
  ansible.builtin.stat:
    path: "{{ development_node_home }}/bin/node"
  register: development_node_binary

- name: Install Node.js {{ development_node_version }}
  when: not development_node_binary.stat.exists
  block:
    - name: Download Node.js
      ansible.builtin.get_url:
        url: "https://nodejs.org/dist/v{{ development_node_version }}/{{ development_node_tarball }}"
        dest: "/tmp/{{ development_node_tarball }}"
        checksum: "sha256:{{ development_upstream_checksums.node[development_node_architecture] }}"
        mode: "0600"

    - name: Create the Node.js directory
      ansible.builtin.file:
        path: "{{ development_node_home }}"
        state: directory
        mode: "0755"

    - name: Extract Node.js
      ansible.builtin.unarchive:
        src: "/tmp/{{ development_node_tarball }}"
        dest: "{{ development_node_home }}"
        remote_src: true
        extra_opts: [--strip-components=1]

    - name: Remove the Node.js tarball
      ansible.builtin.file:
        path: "/tmp/{{ development_node_tarball }}"
        state: absent

- name: Document the Node.js install
  ansible.builtin.copy:
    dest: "{{ development_node_home }}/README.upstream"
    mode: "0644"
    content: |
      Node.js {{ development_node_version }}, installed from upstream.
      To use it, add to your shell profile:

        export PATH="{{ development_node_home }}/bin:$PATH"

# --- Go ---
- name: Check for Go
  ansible.builtin.stat:
    path: "{{ development_go_home }}/bin/go"
  register: development_go_binary

- name: Check the installed Go version
  ansible.builtin.command:
    cmd: "{{ development_go_home }}/bin/go version"
  register: development_go_installed_version
  changed_when: false
  when: development_go_binary.stat.exists

# go version prints "go version go1.27.3 linux/amd64", so the spaces around the
# release keep go1.27.3 from matching an installed go1.27.30.
- name: Install Go {{ development_go_release }}
  when: >-
    not development_go_binary.stat.exists or
    (' ' ~ development_go_release ~ ' ') not in development_go_installed_version.stdout
  block:
    - name: Download Go
      ansible.builtin.get_url:
        url: "https://go.dev/dl/{{ development_go_tarball }}"
        dest: "/tmp/{{ development_go_tarball }}"
        checksum: "sha256:{{ development_upstream_checksums.go[development_go_architecture] }}"
        mode: "0600"

    - name: Remove the previous Go installation
      ansible.builtin.file:
        path: "{{ development_go_home }}"
        state: absent

    - name: Create the Go directory
      ansible.builtin.file:
        path: "{{ development_go_home }}"
        state: directory
        mode: "0755"

    - name: Extract Go
      ansible.builtin.unarchive:
        src: "/tmp/{{ development_go_tarball }}"
        dest: "{{ development_go_home }}"
        remote_src: true
        extra_opts: [--strip-components=1]

    - name: Remove the Go tarball
      ansible.builtin.file:
        path: "/tmp/{{ development_go_tarball }}"
        state: absent

- name: Document the Go install
  ansible.builtin.copy:
    dest: "{{ development_go_home }}/README.upstream"
    mode: "0644"
    content: |
      Go {{ development_go_version }}, installed from upstream.
      To use it, add to your shell profile:

        export PATH="{{ development_go_home }}/bin:$PATH"

# --- smolvm ---
- name: Get the Home Directory
  ansible.builtin.stat:
    path: "~"
  become: false
  register: development_home

- name: Get the installed smolvm version
  ansible.builtin.command: "{{ development_smolvm_home }}/smolvm --version"
  become: false
  register: development_smolvm_installed_version
  changed_when: false
  failed_when: false

- name: Install smolvm {{ development_smolvm_version }}
  become: false
  when: >-
    development_smolvm_installed_version.stdout | default('')
    is not search('\\b' ~ development_smolvm_version | regex_escape ~ '\\b')
  block:
    - name: Download smolvm
      ansible.builtin.get_url:
        url: >-
          https://github.com/smol-machines/smolvm/releases/download/v{{ development_smolvm_version }}/{{ development_smolvm_archive }}
        dest: "/tmp/{{ development_smolvm_archive }}"
        checksum: "sha256:{{ development_upstream_checksums.smolvm[development_smolvm_architecture] }}"
        mode: "0600"

    - name: Create the smolvm installation directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ development_home.stat.path }}/.local/bin"
        - "{{ development_smolvm_home }}"

    - name: Extract smolvm archive
      ansible.builtin.unarchive:
        src: "/tmp/{{ development_smolvm_archive }}"
        dest: "{{ development_smolvm_home }}"
        remote_src: true
        extra_opts: [--strip-components=1]

    - name: Link smolvm into PATH
      ansible.builtin.file:
        src: "{{ development_smolvm_home }}/smolvm"
        dest: "{{ development_home.stat.path }}/.local/bin/smolvm"
        state: link

    - name: Remove the smolvm tarball
      ansible.builtin.file:
        path: "/tmp/{{ development_smolvm_archive }}"
        state: absent

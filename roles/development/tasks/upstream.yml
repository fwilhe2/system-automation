---
# The distributions ship the JDK, Node.js and Go in whatever vintage their
# release froze, so these three come from upstream as tarballs instead. Each one
# is extracted into its own directory below development_upstream_prefix and
# nothing is put on PATH, which is what keeps them from colliding with the
# distribution packages the rest of this role installs.
#
# Every tool follows the same shape: resolve the download, skip the whole block
# when the binary it installs is already there, extract, drop the tarball. That
# guard is what makes the role idempotent, and it is also what stops a second
# run from downloading a few hundred megabytes just to throw them away again.

# --- Eclipse Temurin ---
- name: Check for the Temurin JDK
  ansible.builtin.stat:
    path: "{{ development_temurin_home }}/bin/java"
  register: development_temurin_java

- name: Install Temurin {{ development_temurin_major }}
  when: not development_temurin_java.stat.exists
  block:
    - name: Download Temurin
      ansible.builtin.get_url:
        url: "{{ development_temurin_url }}"
        dest: "{{ development_temurin_tarball }}"
        mode: "0600"

    - name: Create the Temurin directory
      ansible.builtin.file:
        path: "{{ development_temurin_home }}"
        state: directory
        mode: "0755"

    # The tarball unpacks into a jdk-<full version> directory, which is dropped
    # so that the install path stays the feature release alone.
    - name: Extract Temurin
      ansible.builtin.unarchive:
        src: "{{ development_temurin_tarball }}"
        dest: "{{ development_temurin_home }}"
        remote_src: true
        extra_opts: [--strip-components=1]

    - name: Remove the Temurin tarball
      ansible.builtin.file:
        path: "{{ development_temurin_tarball }}"
        state: absent

- name: Document the Temurin install
  ansible.builtin.copy:
    dest: "{{ development_temurin_home }}/README.upstream"
    mode: "0644"
    content: |
      Eclipse Temurin {{ development_temurin_major }}, installed from upstream.
      To use it, add to your shell profile:

        export JAVA_HOME={{ development_temurin_home }}
        export PATH="$JAVA_HOME/bin:$PATH"

# --- Node.js ---
# The release directory is stable but the files in it are not, so the checksum
# file is what names the current tarball. get_url reads the same file again to
# check the download against it.
- name: Get the checksums of the current Node.js release
  ansible.builtin.uri:
    url: "{{ development_node_release_url }}/SHASUMS256.txt"
    return_content: true
  register: development_node_checksums
  changed_when: false

- name: Extract the Node.js version from the checksums
  ansible.builtin.set_fact:
    development_node_version: >-
      {{ development_node_checksums.content
      | regex_search('node-v([0-9.]+)-linux-' ~ development_node_architecture ~ '\.tar\.gz', '\1')
      | first }}

- name: Check for Node.js
  ansible.builtin.stat:
    path: "{{ development_node_home }}/bin/node"
  register: development_node_binary

- name: Install Node.js {{ development_node_version }}
  when: not development_node_binary.stat.exists
  block:
    - name: Download Node.js
      ansible.builtin.get_url:
        url: "{{ development_node_release_url }}/{{ development_node_tarball }}"
        dest: "/tmp/{{ development_node_tarball }}"
        checksum: "sha256:{{ development_node_release_url }}/SHASUMS256.txt"
        mode: "0600"

    - name: Create the Node.js directory
      ansible.builtin.file:
        path: "{{ development_node_home }}"
        state: directory
        mode: "0755"

    - name: Extract Node.js
      ansible.builtin.unarchive:
        src: "/tmp/{{ development_node_tarball }}"
        dest: "{{ development_node_home }}"
        remote_src: true
        extra_opts: [--strip-components=1]

    - name: Remove the Node.js tarball
      ansible.builtin.file:
        path: "/tmp/{{ development_node_tarball }}"
        state: absent

- name: Document the Node.js install
  ansible.builtin.copy:
    dest: "{{ development_node_home }}/README.upstream"
    mode: "0644"
    content: |
      Node.js {{ development_node_version }}, installed from upstream.
      To use it, add to your shell profile:

        export PATH="{{ development_node_home }}/bin:$PATH"

# --- Go ---
# The download index carries both the file name of the pinned release and its
# checksum, so it answers the same question SHASUMS256.txt does for Node.js.
- name: Get the Go download index
  ansible.builtin.uri:
    url: "https://go.dev/dl/?mode=json"
    return_content: true
  register: development_go_index
  changed_when: false

- name: Select the Go tarball for this architecture
  ansible.builtin.set_fact:
    development_go_download: >-
      {{ development_go_index.json
      | selectattr('version', 'match', '^go' ~ development_go_version ~ '(\.|$)')
      | map(attribute='files') | flatten
      | selectattr('os', 'equalto', 'linux')
      | selectattr('arch', 'equalto', development_go_architecture)
      | selectattr('kind', 'equalto', 'archive')
      | first }}

- name: Check for Go
  ansible.builtin.stat:
    path: "{{ development_go_home }}/bin/go"
  register: development_go_binary

- name: Install Go {{ development_go_version }}
  when: not development_go_binary.stat.exists
  block:
    - name: Download Go
      ansible.builtin.get_url:
        url: "https://go.dev/dl/{{ development_go_download.filename }}"
        dest: "/tmp/{{ development_go_download.filename }}"
        checksum: "sha256:{{ development_go_download.sha256 }}"
        mode: "0600"

    - name: Create the Go directory
      ansible.builtin.file:
        path: "{{ development_go_home }}"
        state: directory
        mode: "0755"

    - name: Extract Go
      ansible.builtin.unarchive:
        src: "/tmp/{{ development_go_download.filename }}"
        dest: "{{ development_go_home }}"
        remote_src: true
        extra_opts: [--strip-components=1]

    - name: Remove the Go tarball
      ansible.builtin.file:
        path: "/tmp/{{ development_go_download.filename }}"
        state: absent

- name: Document the Go install
  ansible.builtin.copy:
    dest: "{{ development_go_home }}/README.upstream"
    mode: "0644"
    content: |
      Go {{ development_go_version }}, installed from upstream.
      To use it, add to your shell profile:

        export PATH="{{ development_go_home }}/bin:$PATH"

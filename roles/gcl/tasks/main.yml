---
# gcl is published to GitHub releases by goreleaser, as a tarball holding the
# binary plus its README and licence; only the binary is installed.
- name: Install gcl
  ansible.builtin.import_role:
    name: github_release
  vars:
    github_release_repository: "{{ gcl_repository }}"
    github_release_binary: gcl
    github_release_install_dir: "{{ gcl_install_dir }}"
    github_release_asset: "gcl_{{ ansible_facts['system'] }}_{{ gcl_architectures[ansible_facts['architecture']] }}.tar.gz"
    github_release_checksums: "gcl_{{ github_release_number }}_checksums.txt"
    github_release_include: [gcl]
    github_release_mode: "0755"

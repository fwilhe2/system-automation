# Based on 'Manual installation steps' from https://github.com/lima-vm/lima/blob/master/README.md#installation

---
- name: Get latest Lima release version
  ansible.builtin.uri:
    url: "https://api.github.com/repos/lima-vm/lima/releases/latest"
    return_content: true
    # Authenticate if a token is available; anonymous requests share a
    # 60/hour rate limit per IP, which CI runners regularly exhaust
    headers: "{{ {'Authorization': 'Bearer ' + github_token} if github_token else {} }}"
  vars:
    github_token: "{{ lookup('env', 'GITHUB_TOKEN') }}"
  register: virtualization_latest_release
  changed_when: false

- name: Extract Lima release version
  ansible.builtin.set_fact:
    virtualization_lima_version: "{{ virtualization_latest_release.json.tag_name }}"
  changed_when: false

- name: Download and extract Lima binary
  vars:
    lima_archive: >-
      lima-{{ virtualization_lima_version[1:] }}-{{ ansible_facts['system'] | lower }}-{{ ansible_facts['architecture'] | lower }}.tar.gz
  ansible.builtin.get_url:
    url: "https://github.com/lima-vm/lima/releases/download/{{ virtualization_lima_version }}/{{ lima_archive }}"
    dest: "/tmp/lima-{{ virtualization_lima_version }}.tar.gz"
    mode: "600"
  changed_when: false

- name: Extract Lima binary
  become: true
  become_user: root
  ansible.builtin.unarchive:
    src: "/tmp/lima-{{ virtualization_lima_version }}.tar.gz"
    dest: "/usr/local"
    remote_src: true
  changed_when: false

---
# Based on 'Manual installation steps' from https://github.com/lima-vm/lima/blob/master/README.md#installation
# The tarball is a bin/ and share/ tree meant to be unpacked into a prefix, so
# it is extracted whole into /usr/local.
- name: Install Lima
  ansible.builtin.import_role:
    name: github_release
  vars:
    github_release_repository: lima-vm/lima
    github_release_binary: limactl
    github_release_install_dir: /usr/local/bin
    github_release_extract_dir: /usr/local
    github_release_asset: "lima-{{ github_release_number }}-{{ ansible_facts['system'] }}-{{ ansible_facts['architecture'] }}.tar.gz"
    github_release_checksums: SHA256SUMS

- name: Install Virtualization Packages
  become: true
  ansible.builtin.package:
    state: present
    name: >-
      {{ virtualization_packages[ansible_facts['distribution']]
      | default(virtualization_packages[ansible_facts['os_family']]) }}

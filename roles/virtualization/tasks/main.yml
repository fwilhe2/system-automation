---
# Based on 'Manual installation steps' from https://github.com/lima-vm/lima/blob/master/README.md#installation
- name: Get the installed Lima version
  ansible.builtin.command: limactl --version
  register: virtualization_installed_lima
  changed_when: false
  failed_when: false

- name: Get latest Lima release version
  ansible.builtin.uri:
    url: "https://api.github.com/repos/lima-vm/lima/releases/latest"
    return_content: true
    # Authenticate if a token is available; anonymous requests share a
    # 60/hour rate limit per IP, which CI runners regularly exhaust
    headers: "{{ {'Authorization': 'Bearer ' + github_token} if github_token else {} }}"
  vars:
    github_token: "{{ lookup('env', 'GITHUB_TOKEN') }}"
  register: virtualization_latest_release
  changed_when: false

- name: Extract Lima release version
  ansible.builtin.set_fact:
    virtualization_lima_version: "{{ virtualization_latest_release.json.tag_name }}"

# limactl prints 'limactl version 1.2.3' where the release is tagged 'v1.2.3'.
# Comparing the two is what makes this role idempotent: it downloads, and
# reports a change, only when it really installs a different Lima.
- name: Install Lima
  when: virtualization_lima_version[1:] not in virtualization_installed_lima.stdout | default('')
  vars:
    virtualization_lima_archive: >-
      lima-{{ virtualization_lima_version[1:] }}-{{ ansible_facts['system'] | lower }}-{{ ansible_facts['architecture'] | lower }}.tar.gz
  block:
    - name: Download Lima
      ansible.builtin.get_url:
        url: "https://github.com/lima-vm/lima/releases/download/{{ virtualization_lima_version }}/{{ virtualization_lima_archive }}"
        dest: "/tmp/{{ virtualization_lima_archive }}"
        mode: "600"

    - name: Extract Lima binary
      become: true
      ansible.builtin.unarchive:
        src: "/tmp/{{ virtualization_lima_archive }}"
        dest: "/usr/local"
        remote_src: true

# smolvm is installed from its release archive because the archive includes
# the guest runtime files it needs alongside the executable.
- name: Get the Home Directory
  ansible.builtin.stat:
    path: "~"
  register: virtualization_home

- name: Get the installed smolvm version
  ansible.builtin.command: "{{ virtualization_home.stat.path }}/.local/share/smolvm/smolvm --version"
  register: virtualization_installed_smolvm
  changed_when: false
  failed_when: false

- name: Get latest smolvm release version
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ virtualization_smolvm_repository }}/releases/latest"
    return_content: true
    headers: "{{ {'Authorization': 'Bearer ' + github_token} if github_token else {} }}"
  vars:
    github_token: "{{ lookup('env', 'GITHUB_TOKEN') }}"
  register: virtualization_smolvm_latest_release
  changed_when: false

- name: Extract smolvm release version
  ansible.builtin.set_fact:
    virtualization_smolvm_version: "{{ virtualization_smolvm_latest_release.json.tag_name }}"

- name: Install smolvm
  when: virtualization_smolvm_version[1:] not in virtualization_installed_smolvm.stdout | default('')
  vars:
    virtualization_smolvm_archive: >-
      smolvm-{{ virtualization_smolvm_version[1:] }}-linux-{{ virtualization_smolvm_architectures[ansible_facts['architecture']] }}.tar.gz
    virtualization_smolvm_asset: >-
      {{ virtualization_smolvm_latest_release.json.assets
      | selectattr('name', 'equalto', virtualization_smolvm_archive) | first }}
  block:
    - name: Download smolvm
      ansible.builtin.get_url:
        url: >-
          https://github.com/{{ virtualization_smolvm_repository }}/releases/download/{{ virtualization_smolvm_version }}/{{ virtualization_smolvm_archive }}
        dest: "/tmp/{{ virtualization_smolvm_archive }}"
        checksum: "{{ virtualization_smolvm_asset.digest }}"
        mode: "600"

    - name: Create the smolvm installation directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "755"
      loop:
        - "{{ virtualization_home.stat.path }}/.local/bin"
        - "{{ virtualization_home.stat.path }}/.local/share/smolvm"

    - name: Extract smolvm archive
      ansible.builtin.unarchive:
        src: "/tmp/{{ virtualization_smolvm_archive }}"
        dest: "{{ virtualization_home.stat.path }}/.local/share/smolvm"
        remote_src: true
        extra_opts: [--strip-components=1]

    - name: Link smolvm into PATH
      ansible.builtin.file:
        src: "{{ virtualization_home.stat.path }}/.local/share/smolvm/smolvm"
        dest: "{{ virtualization_home.stat.path }}/.local/bin/smolvm"
        state: link

- name: Install Virtualization Packages
  become: true
  ansible.builtin.package:
    state: present
    name: >-
      {{ virtualization_packages[ansible_facts['distribution']]
      | default(virtualization_packages[ansible_facts['os_family']]) }}

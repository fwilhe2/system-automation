---
# Install Docker from the official repos
# References:
# https://docs.docker.com/engine/install/ubuntu/
# https://github.com/geerlingguy/ansible-role-docker/blob/master/tasks/setup-Debian.yml

- name: Uninstall old versions
  ansible.builtin.apt:
    state: absent
    name:
      - docker
      - docker-engine
      - docker.io
      - containerd
      - runc
  become: true

- name: Set up the repository
  ansible.builtin.apt:
    state: present
    name:
      - ca-certificates
      - curl
      - gnupg
      # Feeds ansible_facts['lsb'], which the codename below reads
      - lsb-release
  become: true

# Docker publishes no packages for the development branches, so those fall back
# to the newest codename it does publish. Ubuntu calls its development branch
# out in the description, Debian's is the one that still says 'sid'.
- name: Get codename for the Docker APT repository
  ansible.builtin.set_fact:
    docker_release_codename: >-
      {{ docker_development_branch_codename[ansible_facts['distribution']] | default(ansible_facts['distribution_release'])
      if ansible_facts['lsb'].description is search('development branch|sid', ignorecase=True)
      else ansible_facts['distribution_release'] }}

- name: Add Docker APT repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
    suites: "{{ docker_release_codename }}"
    components: [stable]
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present
    enabled: true
  become: true

- name: Install Docker Engine
  ansible.builtin.apt:
    state: present
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    update_cache: true
  become: true

- name: Start and enable the docker service
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  become: true

- name: Ensure group "docker" exists with correct gid
  ansible.builtin.group:
    name: docker
    state: present
    gid: 1750
  become: true

- name: Add user to group
  ansible.builtin.user:
    name: "{{ username }}"
    groups: docker
    append: true
  become: true

- name: Install podman
  ansible.builtin.apt:
    state: present
    name: podman
  become: true
  # TODO: Update once focal is not required anymore
  when: ansible_facts['distribution_release'] != "focal"

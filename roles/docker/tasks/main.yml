---
- name: Install Docker on Fedora
  ansible.builtin.import_tasks: fedora.yml
  when: ansible_facts['distribution'] == 'Fedora'

- name: Install Docker on Debian and derivatives
  ansible.builtin.import_tasks: deb.yml
  when: ansible_facts['os_family'] == 'Debian'

# Where docker itself is not packaged, podman stands in for it
- name: Install podman
  ansible.builtin.package:
    state: present
    name: podman
  when: >-
    ansible_facts['os_family'] == 'Suse'
    or (ansible_facts['os_family'] == 'RedHat' and ansible_facts['distribution'] != 'Fedora')

- name: Install Dive
  ansible.builtin.import_role:
    name: github_release
  vars:
    github_release_repository: "{{ docker_dive_repository }}"
    github_release_binary: dive
    github_release_install_dir: "{{ docker_dive_install_dir }}"
    github_release_asset: "dive_{{ github_release_number }}_linux_{{ docker_dive_architectures[ansible_facts['architecture']] }}.tar.gz"
    github_release_checksums: "dive_{{ github_release_number }}_checksums.txt"
    github_release_include: [dive]
    github_release_mode: "0755"

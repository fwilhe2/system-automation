---
# Codename to use for the Docker APT repository on the distributions'
# development branches, which Docker itself does not publish packages for.
docker_development_branch_codename:
  Ubuntu: jammy
  Debian: trixie
  Tuxedo: trixie
  Tuxedo OS: trixie

docker_development_branch_releases:
  Ubuntu: [resolute]

docker_dive_repository: wagoodman/dive
docker_dive_install_dir: /usr/local/bin
docker_dive_architectures:
  x86_64: amd64
  aarch64: arm64

# Based on an example from https://lima-vm.io/docs/examples/gha/

name: CI with Lima VM

on:
  workflow_dispatch:

jobs:
  lima:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [fedora, debian]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Set up Lima"
        uses: lima-vm/lima-actions/setup@55627e31b78637bf254a8b2a14da8ea7d12564e5 # v1.1.0
        id: lima-actions-setup

      - name: "Cache ~/.cache/lima"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lima
          key: lima-${{ steps.lima-actions-setup.outputs.version }}

      - name: "Start an instance of ${{ matrix.distro }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eux

          cat test/lima/${{ matrix.distro }}.yaml | limactl create --name=default -
          limactl start
          # The guest gets no environment from the host, so hand the token over
          # explicitly - without it the GitHub API calls hit the anonymous rate limit.
          set +x
          lima env GITHUB_TOKEN="$GITHUB_TOKEN" ansible-playbook playbooks/common.yml

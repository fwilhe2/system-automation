name: Lint (fast, no build)
on:
  push:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `args:` on purpose: ansible-lint then discovers the playbooks and
      # roles itself.
      # The playbooks use community.general, so the collection has to be present
      # or every task using it is reported as an unresolvable module.
      - uses: ansible/ansible-lint@665d9e07a1943254d2910faffc106adaf7ea7294 # v26.8.0
        with:
          requirements_file: requirements.yml

      - name: Check formatting
        run: npx --yes prettier --check "./**/*.yml"

      - name: Check shell scripts
        run: shellcheck scripts/*.sh

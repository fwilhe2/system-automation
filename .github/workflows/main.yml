name: CI

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  # One job per distribution the playbooks claim to support, on both
  # architectures. The build and run flags live in scripts/container-test.sh,
  # so a local run is the same run this makes.
  container:
    name: ${{ matrix.distro }}${{ matrix.runner }}
    runs-on: ubuntu-24.04${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ["", "-arm"] #amd64 and arm
        distro:
          - ubuntu:latest
          - ubuntu:rolling
          # ubuntu:devel and fedora:rawhide are commented out while they are
          # broken for reasons of their own, unrelated to the playbooks
          # - ubuntu:devel
          - debian:stable
          - debian:testing
          - debian:unstable
          - fedora:latest
          # - fedora:rawhide
          - el:almalinux:10
          - opensuse:tumbleweed
          - opensuse:leap:16.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test on ${{ matrix.distro }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONTAINER_CLI: docker
        run: ./scripts/container-test.sh "${{ matrix.distro }}"

  # Separate because the archlinux image is published for amd64 only, and
  # because it applies the common playbook rather than the full test suite.
  archlinux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test on archlinux
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONTAINER_CLI: docker
        run: ./scripts/container-test.sh archlinux

  syntax-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: pip3 install ansible
      - run: ansible-playbook --syntax-check site.yml

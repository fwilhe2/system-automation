name: Update upstream checksums

on:
  workflow_dispatch: 

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install updater dependencies
        run: sudo apt-get update && sudo apt-get install --yes jq

      - name: Update upstream checksums
        run: ./scripts/update-upstream-checksums.sh

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/update-upstream-checksums
          delete-branch: true
          commit-message: "build(deps): update upstream checksums"
          title: "build(deps): update upstream checksums"
          body: |
            Updates the generated upstream checksums after the scheduled CI run
            detected that an upstream release no longer matches the pinned data.

            Generated by `scripts/update-upstream-checksums.sh`.

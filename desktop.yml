---
- name: Desktop (GNOME) Playbook
  hosts: all

  vars_files:
    - default.config.yml

  pre_tasks:
    - name: Load Configuration Overrides
      ansible.builtin.include_vars: "{{ item }}"
      loop: "{{ query('ansible.builtin.first_found', ['config.yml'], errors='ignore') }}"
      tags: always

  roles:
    # Skipped where Microsoft's repo signing fails modern OpenPGP verifiers:
    # Tumbleweed's rpm rejects the key armor, and the stale arm64 'code'
    # package ships a SHA-1-signed keyring that Debian's sqv rejects
    - role: iesplin.vscode
      become: true
      when: >-
        ansible_facts['distribution'] != 'openSUSE Tumbleweed'
        and not (ansible_facts['distribution'] == 'Debian' and ansible_facts['architecture'] == 'aarch64')

    - role: greenleader.codium
      become: true

    - role: firefox
      tags: firefox

    - role: flatpak

    - role: rpm_fusion
      become: true

  tasks:
    - name: Install Desktop Packages
      become: true
      become_user: root
      ignore_errors: true
      ansible.builtin.package:
        state: present
        name: "{{ item }}"
      loop: "{{ desktop_packages[ansible_facts['os_family']] }}"

    - name: Install VS Codium Extensions
      codium-extensions:
        name: "{{ item }}"
        state: present
      loop: "{{ codium_extensions }}"
